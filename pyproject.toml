[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "picf-next"
version = "0.1.0"
description = "Host-neutral persistent multimodal object posterior for VLA research"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "networkx>=3.4,<4",
  "numpy>=1.23",
  "scipy>=1.9",
]

[project.optional-dependencies]
lingbot-native = [
  "omegaconf==2.3.0",
  "torch==2.8.0",
]
vjepa2-ac = [
  "einops==0.8.1",
  "timm==1.0.20",
  "torch==2.8.0",
  "torchvision==0.23.0",
]
calvin-offline = [
  "antlr4-python3-runtime==4.9.3",
  "cloudpickle==3.1.2",
  "colorlog==6.12.0",
  "gitpython==3.1.55",
  "gym==0.26.2",
  "gym-notices==0.1.0",
  "hydra-colorlog==1.2.0",
  "hydra-core==1.3.2",
  "llvmlite==0.44.0",
  "matplotlib==3.10.3",
  "numba==0.61.2",
  "numpy==1.26.4",
  "numpy-quaternion==2024.0.13",
  "omegaconf==2.3.0",
  "opencv-python-headless==4.11.0.86",
  "pandas==2.3.1",
  "pybullet==3.2.7",
  "pyyaml==6.0.2",
  "rich==14.1.0",
  "scipy==1.13.1",
]

[dependency-groups]
dev = [
  "omegaconf==2.3.0",
  "pillow>=11.0",
  "pytest>=8.0",
  "pyyaml==6.0.2",
  "ruff>=0.5",
  "safetensors>=0.4",
  "tomli>=2.0; python_version < '3.11'",
]

audit = [
  "pyarrow>=21.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/picf_next"]

[tool.hatch.build.targets.sdist]
exclude = [
  "/dist",
  "/evidence",
  "/legacy",
  "/references/papers",
  "/references/source_checkouts",
  "/temp",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
